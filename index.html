<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Какой ты мем?</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">

    <!-- Экран 1: старт -->
    <section id="screen-start" class="card screen">
      <div class="big-emoji">🤔</div>
      <h1>Какой ты мем?</h1>
      <p class="muted">
        Ответь на несколько вопросов и узнай, какой интернет-мем
        больше всего похож на тебя.
      </p>
      <button id="btn-start" class="btn btn-primary">Начать тест</button>
    </section>

    <!-- Экран 2: вопросы -->
    <section id="screen-quiz" class="screen hidden">
      <div class="progress-wrap">
        <div class="progress-text">
          <span id="progress-label">Вопрос 1 из 8</span>
          <span id="answered-label">Отвечено: 0</span>
        </div>
        <div class="progress"><div id="progress-bar" class="progress-bar"></div></div>
      </div>

      <div id="question-card" class="card">
        <h2 id="question-text"></h2>
        <div id="answers" class="answers"></div>
        <p id="error" class="error hidden"></p>
      </div>

      <div class="nav">
        <button id="btn-prev" class="btn btn-secondary">← Назад</button>
        <button id="btn-next" class="btn btn-primary">Далее →</button>
      </div>
    </section>

    <!-- Экран 3: результат -->
    <section id="screen-result" class="card screen hidden">
      <p class="muted">Ты —</p>
      <div id="result-emoji" class="big-emoji"></div>
      <h1 id="result-title"></h1>
      <p id="result-subtitle" class="subtitle"></p>
      <div class="match">Совпадение: <strong id="result-percent"></strong></div>
      <p id="result-desc"></p>

      <h3>Рекомендации</h3>
      <ul id="result-tips" class="tips"></ul>

      <h3>Твой профиль по всем мемам</h3>
      <div id="result-bars" class="bars"></div>

      <p id="save-status" class="save-status"></p>

      <button id="btn-restart" class="btn btn-primary">Пройти ещё раз</button>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
