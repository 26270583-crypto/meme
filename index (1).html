<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Какой ты мем?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <main class="app">

    <!-- Экран 1: старт -->
    <section id="screen-start" class="card screen">
      <span class="chip">Тест · 8 вопросов · ~2 минуты</span>
      <h1>Какой ты <span class="grad">мем?</span></h1>
      <p class="lead">
        Ответь на несколько вопросов и узнай, какой интернет-мем
        лучше всего описывает твой характер.
      </p>

      <form id="start-form" class="start-form" novalidate>
        <label for="player-name">Как тебя зовут?</label>
        <input id="player-name" type="text" maxlength="30" placeholder="Например, Алия" autocomplete="given-name">
        <p id="name-error" class="error hidden"></p>
        <button type="submit" class="btn btn-primary btn-wide">Начать тест</button>
      </form>
    </section>

    <!-- Экран 2: вопросы -->
    <section id="screen-quiz" class="screen hidden">
      <div class="progress-wrap">
        <div class="progress-text">
          <span id="progress-label">Вопрос 1 из 8</span>
          <span id="answered-label">0 / 8</span>
        </div>
        <div class="progress"><div id="progress-bar" class="progress-bar"></div></div>
      </div>

      <div id="question-card" class="card">
        <h2 id="question-text"></h2>
        <div id="answers" class="answers"></div>
        <p id="error" class="error hidden"></p>
      </div>

      <div class="nav">
        <button id="btn-prev" class="btn btn-ghost">← Назад</button>
        <button id="btn-next" class="btn btn-primary">Далее →</button>
      </div>
    </section>

    <!-- Экран 3: результат -->
    <section id="screen-result" class="card screen hidden">
      <p id="result-greeting" class="greeting"></p>
      <div id="result-ring" class="ring"><div class="ring-inner" id="result-emoji"></div></div>
      <h1 id="result-title" class="result-title"></h1>
      <p id="result-subtitle" class="subtitle"></p>
      <div class="match">Совпадение <strong id="result-percent"></strong></div>

      <p id="result-desc" class="desc"></p>

      <div class="block">
        <h3>Рекомендации</h3>
        <ul id="result-tips" class="tips"></ul>
      </div>

      <div class="block">
        <h3>Твой профиль по всем мемам</h3>
        <div id="result-bars" class="bars"></div>
      </div>

      <p id="save-status" class="save-status"></p>
      <button id="btn-restart" class="btn btn-primary btn-wide">Пройти ещё раз</button>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
